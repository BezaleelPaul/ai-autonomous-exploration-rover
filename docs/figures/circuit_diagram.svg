="490">12V Terminal &lt;- Battery (+7.4V)</text><text fill="#bf360c" font-family="monospace" font-size="11px" x="400" y="520">GND Terminal &lt;- Common Ground</text><text fill="#bf360c" font-family="monospace" font-size="11px" x="400" y="550">ENA / ENB   &lt;- PWM 5 / 10</text><text fill="#bf360c" font-family="monospace" font-size="11px" x="400" y="580">IN1 - IN4   &lt;- Pins 6 - 9</text><text fill="#bf360c" font-family="monospace" font-size="11px" x="400" y="610">OUT1 / OUT2 -&gt; LEFT MOTOR</text><text fill="#bf360c" font-family="monospace" font-size="11px" x="400" y="640">OUT3 / OUT4 -&gt; RIGHT MOTOR</text><rect fill="#efebe9" height="120" rx="8" ry="8" stroke="#4e342e" stroke-width="2" width="180" x="40" y="420" /><text fill="#4e342e" font-family="Arial" font-size="15px" font-weight="bold" text-anchor="middle" x="130.0" y="445">LEFT MOTOR</text><text fill="#555555" font-family="Arial" font-size="11px" text-anchor="middle" x="130.0" y="462">TT DC Gear Motor (1:48, 6V)</text><text font-family="Arial" font-size="11px" text-anchor="middle" x="130" y="490">Decoupled w/ 0.1uF</text><rect fill="#efebe9" height="120" rx="8" ry="8" stroke="#4e342e" stroke-width="2" width="180" x="40" y="580" /><text fill="#4e342e" font-family="Arial" font-size="15px" font-weight="bold" text-anchor="middle" x="130.0" y="605">RIGHT MOTOR</text><text fill="#555555" font-family="Arial" font-size="11px" text-anchor="middle" x="130.0" y="622">TT DC Gear Motor (1:48, 6V)</text><text font-family="Arial" font-size="11px" text-anchor="middle" x="130" y="650">Decoupled w/ 0.1uF</text><rect fill="#e0f2f1" height="180" rx="8" ry="8" stroke="#00796b" stroke-width="2" width="150" x="1020" y="480" /><text fill="#00796b" font-family="Arial" font-size="15px" font-weight="bold" text-anchor="middle" x="1095.0" y="505">HC-SR04</text><text fill="#555555" font-family="Arial" font-size="11px" text-anchor="middle" x="1095.0" y="522">Front Ranging (40 kHz)</text><text font-family="monospace" font-size="11px" tex