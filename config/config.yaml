# Central configuration — student-editable. All units noted.
camera:
  esp32_url: "http://192.168.1.100:81/stream"
  width: 640
  height: 480
  fps_target: 15
  reconnect_timeout_s: 5.0
  frozen_frame_timeout_s: 3.0
  jpeg_timeout_s: 2.0
  # Inference-frame enhancement (display stays raw): fixes dull/yellow/dark
  # frames before they reach the model. Cheap (~10ms). Denoise is slow: off.
  enhance_clahe: true
  enhance_sharpen: true
  enhance_denoise: false
  enhance_fourier: true     # 2D Fourier Homomorphic High-Frequency Emphasis (HFE)
  ground_plane:
    height_m: 0.0       # camera height above the floor, metres; 0 = disabled
                        # (calibrate by measuring lens-to-floor). When set, a
                        # pinhole floor-hit fallback gives a metric distance
                        # for floor-standing objects even before the
                        # ultrasonic depth calibration is ready.
    focal_px: 600.0     # focal length in pixels (640-wide frame); rough
                        # default ~ phone camera hFOV ~55 deg
    pitch_deg: 0.0      # camera pitch relative to horizontal (positive =
                        # looking down)

ai:
  model_name: "facebook/detr-resnet-50"
  model_dir: "models/detr-resnet-50"
  yolo_model: "yolo11n.pt"
  export: "torch"        # inference engine: torch | onnx | openvino.
                             # Resolves <stem>.onnx / <stem>_openvino_model and
                             # falls back to the .pt if the artifact is absent
                             # (software/ai/detector.py resolve_model_path).
                             # OpenVINO iGPU (HD 620) measured via ultralytics
                             # track @320 static: p50 66.9 ms = 14.9 FPS, 2.2x
                             # faster than ONNX@416 (reports/INFER_BENCH.md).
                             # MUST stay static (dynamic=True -> 172 ms: shader
                             # recompile poisons the iGPU) and MUST stay @320
                             # (@416 -> 181 ms: HD 620 chokes on the big tensor).
  openvino_device: "intel:gpu"  # OpenVINO device for the openvino engine:
                             # intel:gpu (iGPU, fast) | intel:cpu. Auto-falls
                             # back to intel:cpu when no iGPU is present
                             # (software/ai/detector.py _resolve_ov_device).
  vlm_enabled: false         # BLIP caption-on-demand (ai/explainer.py); first
                             # use downloads ~1 GB of BLIP weights
  tracker: "botsort.yaml"  # multi-object tracker: tracktrack.yaml | botsort.yaml | bytetrack.yaml | fasttrack.yaml | ocsort.yaml
  sahi_enabled: false        # SAHI (Slicing Aided Hyper Inference) for small/far distant objects
  sahi_slice_size: 320       # tile dimensions for sliced multi-scale inference
  sahi_overlap: 0.20         # overlap ratio between adjacent tiles
  #   Accuracy caveat (reports/MODEL_BENCHMARK.md, 2026-09-26): yolo26n recall
  #   0.3541 vs yolo11s 0.4769 (-12.3 pts), F1 0.4962 vs 0.6011 — it is the
  #   realtime/low-power pick, NOT the accuracy pick: yolo11s stays the
  #   accuracy reference and yolo11n is dominated at equal speed.
  # Words the world-model looks for (COCO has no "pen" — this list fixes that).
  # Full vocabulary: all 80 COCO classes + common extras (pen/watch/keys/...).
  # Singular nouns only — CLIP matches those best.
  custom_classes: ["person", "bicycle", "car", "motorcycle", "airplane", "bus",
                   "train", "truck", "boat", "traffic light", "fire hydrant",
                   "stop sign", "parking meter", "bench", "bird", "cat", "dog",
                   "horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe",
                   "backpack", "umbrella", "handbag", "tie", "suitcase", "frisbee",
                   "skis", "snowboard", "sports ball", "kite", "baseball bat",
                   "baseball glove", "skateboard", "surfboard", "tennis racket",
                   "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl",
                   "banana", "apple", "sandwich", "orange", "broccoli", "carrot",
                   "hot dog", "pizza", "donut", "cake", "chair", "couch",
                   "potted plant", "bed", "dining table", "toilet", "tv", "laptop",
                   "mouse", "remote", "keyboard", "cell phone", "microwave", "oven",
                   "toaster", "sink", "refrigerator", "book", "clock", "vase",
                   "scissors", "teddy bear", "hair drier", "toothbrush",
                   "pen", "pencil", "marker", "watch", "keys", "wallet", "glasses",
                   "earbuds", "charger", "stapler", "ruler", "eraser"]
  yolo_imgsz: 320            # input resolution; MUST match the OpenVINO export
                             # (static 320, see export: above). ONNX numbers for
                             # reference (idle i5-7300U, reports/INFER_BENCH.md
                             # 2026-10-18): 320 -> 92 ms, 416 -> 145 ms. On the
                             # iGPU, 320 (67 ms) beats 416 (181 ms) 2.7x —
                             # small-object recall is traded for realtime; raise
                             # confidence_threshold's companion imgsz only when
                             # re-exporting a larger static model.
  yolo_track: true           # ByteTrack IDs keep labels glued to objects
  min_box_px: 8              # drop tiny-box false positives (yolo backend);
                             # 20 px silently discarded small objects (eval)
  confidence_threshold: 0.25 # detector operating point on COCO128: 0.5 ->
                             # recall 0.352, 0.25 -> 0.477, F1 0.601 vs 0.509.
  target_confidence: 0.5     # separate gate for acting on a detection: which
                             # objects ObjectTracker steers toward AND the
                             # minimum confidence for forward motion
                             # (SafetyManager LOW_CONFIDENCE). Kept at the old
                             # 0.5 so the extra low-confidence detections are
                             # visible without letting the rover approach them.
  iou_threshold: 0.5
  # Empty = detect all 80 COCO classes (best for testing held objects).
  # Rover target filtering still happens in ObjectTracker by --target name.
  allowed_classes: []
  target_class: "bottle"    # default --target (override via TARGET_CLASS env / --target)
  device: "cpu"          # cpu | cuda
  # Measured (CPU, logs/benchmark.json): yolo11s p50 119-211 ms @320,
  # load 0.4 s, weights in repo root.
  # Measured on COCO128 (logs/detection_baseline.json vs logs/detection_final.json):
  # conf 0.25 + min_box 8 => recall 0.352->0.477, multi-object recall
  # 0.347->0.471, F1 0.509->0.601, mAP50 0.618->0.640.
  # Latency is load-dependent (H4 = 2 x p50 must close under 1.0 s):
  #   p50 184 ms @50% CPU load  -> 0.37 s refresh -> H4 green
  #   p50 534-685 ms @100% load -> 1.07-1.37 s refresh -> H4 RED
  # Run the realtime gate with the host at <=~60% load (see docs/testing.md).
  # See scripts/eval_detection.py; act-on gate is ai.target_confidence.
  # backend hf (DETR-ResNet-50) measured ~5.1 s/infer — accuracy option, NOT realtime.
  inference_interval: 2  # run inference every N frames (perf tuning, see scripts/benchmark.py)
  backend: "yolo"        # yolo (realtime default) | hf | color | mock

explorer:
  enabled: false           # Gemini narration of the journey (advisory only).
                           # Needs GEMINI_API_KEY in the environment — the key
                           # is NEVER read from config and never written to
                           # disk. Measured on this host: one narrated entry
                           # costs 6.9 s, so this can never sit in the control
                           # loop (H4 needs 0.50 s). Fail-soft: no key or a
                           # dead network leaves the deck untouched.
  interval_s: 60.0         # minimum seconds between narrated entries, and the
                           # entries only fire when something actually changed
                           # (new object class / path verdict / mode / target)
  model: "gemini-2.5-flash"
  max_tokens: 700          # cap per entry (~55-100 words of prose)
  journal_dir: "data/journal"  # one subdir per power-on session

plugins:
  enabled: ["scenesense"]
                         # vision enhancers loaded by software/plugins (see
                         # software/plugins/__init__.py).
                         # One detector pass only: the COCO control model runs
                         # per frame. Add "world" (YOLO-World open-vocab second
                         # pass: pen/watch/keys/... that COCO-80 misses, with
                         # IoU>=0.5 duplicates dropped) only when the extra CPU
                         # is affordable — on the 2-core host it duplicates the
                         # per-frame detection and starves the realtime loop.
                         # "scenesense" = surroundings understanding: monocular
                         # depth + world model (near/far, motion, ON relations,
                         # path blocked) -> feed.world on the deck.
  world_every_n: 2       # cost dial: 1 = every worker pass, 2 = every other
                         # (~half the extra CPU), 3+ = rarer refresh of labels
  world_conf: 0.25       # world-model confidence floor (same as control model)
  scenesense_every_n: 1   # depth+world-model refresh cadence (1 = every pass;
                         # the worker thread's slow_interval_s sets the rate)
  world_deadline_s: 12.0  # watchdog: world older than this -> DEGRADED on deck
                         # (fail-loud instead of silently treating a stale
                         # fact stream as current). Sized for the CPU-only
                         # host, where one depth+world pass takes ~5-9 s.
  slow_interval_s: 2.0   # plugin worker breather between passes so the slow
                         # plugins can't peg the CPU and starve the detector
  world_k_sigma: 2.0     # distance intervals are estimate ± k·sigma (sigma =
                         # ultrasonic-calibration residual + KF uncertainty)
  world_clear_m: 0.5     # STL spec margin: always (ultrasonic > world_clear_m);
                         # robustness rho reported live on the deck
  world_spec_window_s: 2.0  # STL evaluation window (seconds)
  scenesense_metric_depth: false  # false = relative depth + ultrasonic fit
                         # (inverse-depth calibrator, needs 4+ pairs). true =
                         # Depth-Anything-V2 Metric checkpoint: depth map is
                         # already metres, calibrator is skipped, world facts
                         # report d=x±y m immediately (~100 MB HF download on
                         # first frame).
  scenesense_depth_model: ""  # HF checkpoint override; empty = mode default
                         # (relative .../Depth-Anything-V2-Small-hf, or the
                         # metric .../Metric-Indoor-Small-hf when
                         # scenesense_metric_depth: true)

# Auto-tune (software/autotune): measure -> explore -> commit -> monitor ->
# re-arm. A dial is searched over a small bounded set, the cheapest value that
# satisfies its constraint is committed, and the committed value is then
# watched: a cost that degrades (or improves) past its re-arm band throws the
# dial back to exploration, so the system re-finds its optimum on its own and
# stabilises there. Nothing in here can touch safety, serial, navigation or
# rover geometry — the tuner only reads dials this file declares.
autotune:
  enabled: true           # master switch: false = shipped values, forever
  learned_path: "config/learned.yaml"  # remembered operating point, merged in
                          # by load_config as file < learned < environment;
                          # "" disables persistence entirely. Git-ignored: it
                          # is a runtime artifact, regenerated by the calibrator.
  window_s: 2.0           # how long one candidate is measured before it is
                          # judged (s); longer = less noise, slower convergence
  budget_margin: 0.25     # detection-refresh budget = this x
                          # navigation.target_lock_duration_s. 0.25 x 2.0 s =
                          # 0.5 s, the "~0.5 s refresh" target in README section
                          # 5; the tuner keeps refresh at or under that.
  max_interval: 8         # ceiling of the ai.inference_interval search (1..8)
  rearm_ratio: 1.5        # committed cost worse than 1.5x -> explore again
  improve_ratio: 0.5      # committed cost better than 0.5x -> explore again
                          # (both are what "stabilise unless the world changed")

rover:
  width_cm: 18.0
  length_cm: 22.0
  safety_margin_cm: 8.0
  min_obstacle_distance_cm: 30.0
  slow_down_distance_cm: 30.0
  emergency_stop_distance_cm: 15.0
  movement_timeout_s: 1.0
  turning_duration_s: 0.5
  search_rotation_duration_s: 10.0  # 30s search_timeout / 10s => 3 rotations >= max_search_rotations=2
  approach_stop_width_ratio: 0.45  # if bbox width > 45% frame => VERY CLOSE => stop
  max_speed_pwm: 200

# Explore mode (deck "EXPLORE" button / dashboard.pilot MODES): roam loop
# drive -> ultrasonic/world blocked -> scan dwell -> pivot ~90 deg (alternating
# L/R) -> repeat until the time or turn budget runs out. SafetyManager stays
# tier-1: every proposed command still passes the shared safety gate.
explore:
  blocked_cm: 40.0  # stop driving below this ultrasonic distance (cm)
  scan_s: 1.5  # dwell at each stop so scenesense/CLIP refresh world facts (s)
  turn_s: 0.6  # in-place pivot duration per heading change (s)
  max_duration_s: 180.0  # auto-stop after this long (Mars-sol style budget, s)
  max_turns: 8  # or after this many blocked-turns (whichever comes first)

# Phase 9+ closed-loop drive foundation (docs/future-work/30_FUTURE_WORK.md).
# Gains feed software/control/pid.py; geometry feeds software/control/odometry.py.
# velocity_* are firmware constants (rover_controller.ino), synced by contract
# test; steering_* drive laptop-side proportional turn PWM (Protocol v2).
# encoders_enabled stays false until real encoders are fitted (HARDWARE REQUIRED).
control:
  encoders_enabled: false
  encoder_ppr: 20
  wheel_diameter_cm: 6.5
  pid_kp: 1.2
  pid_ki: 0.0
  pid_kd: 0.05
  velocity_kp: 1.2
  velocity_target_tps: 50
  velocity_pwm_ff: 150
  velocity_period_ms: 50
  steering_kp: 600.0
  steering_min_pwm: 120

serial:
  port: "COM3"
  baud_rate: 9600
  command_timeout_s: 1.0
  heartbeat_interval_s: 2.0
  reconnect_attempts: 5

navigation:
  left_boundary: 0.33
  center_boundary: 0.66
  center_tolerance: 0.06
  target_lock_duration_s: 2.0
  search_timeout_s: 30.0
  max_search_rotations: 2
  min_command_duration_s: 0.4
  decision_cooldown_s: 0.2

safety:
  comm_timeout_s: 3.0
  sensor_invalid_limit: 5
  require_camera_for_auto: true
  require_serial_for_auto: true

# Two-tier stack (software/perception_node + esp32/bt_bridge + arduino/motion_safety):
# phone IP Webcam -> YOLOv8n target lock -> single-char F/L/R/S over a USB or
# Bluetooth virtual COM port. Independent of the ESP32-CAM loop above: nothing
# in the original stack reads this section, and this node never reads theirs.
perception:
  stream_url: "http://192.168.1.10:8080/video"  # IP Webcam app: http://<PHONE_IP>:8080/video
  model: "yolov8m-worldv2.pt"  # Medium Open-Vocabulary Vision Transformer
  target_class: "person"
  confidence_threshold: 0.4
  imgsz: 320                   # realtime budget on CPU (see reports/MODEL_BENCHMARK.md)
  inference_interval: 2        # infer every Nth frame; HUD keeps the last detections
  left_boundary: 0.33          # |<- LEFT ->| CENTER |<- RIGHT ->|
  center_boundary: 0.66
  stop_area_ratio: 0.35        # bbox area / frame area at or above this = too close -> 'S'
  serial_mode: "auto"          # auto | usb | bluetooth | http  (http = ESP32 WiFi bridge)
  serial_port: ""              # explicit port, e.g. COM5 for a BT adapter; empty = auto-detect
  rover_url: "http://192.168.4.1"  # ESP32 soft-AP base URL for serial_mode: http
  baud_rate: 9600
  heartbeat_interval_s: 0.4    # resend the active command; must beat the Uno's
                               # 500 ms link watchdog (motion_safety.ino), and
                               # also stays < safety.comm_timeout_s (3 s)
  command_cooldown_s: 0.2      # minimum spacing between distinct commands
  hud_enabled: true
  window_name: "AI Rover - Perception Node"

dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 5000
  mode: "manual"             # manual | auto | observe — MissionPilot start mode
  decision_history: 60       # why-chain ring buffer length for /api/decision
  record_dir: "data/runs"    # run captures land in <record_dir>/<ISO timestamp>/
  record_every_s: 1.0        # min gap between periodic annotated frames

logging:
  level: "INFO"
  dir: "logs"
  log_frames: false
