name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'AI Rover Companion App v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Flutter APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'
          cache: true

      - name: Verify Flutter Installation
        run: |
          flutter --version
          flutter doctor

      - name: Install Dependencies
        working-directory: mobile/rover_companion
        run: |
          flutter pub get

      - name: Run Flutter Tests
        working-directory: mobile/rover_companion
        run: |
          flutter test

      - name: Build Android Release APK
        working-directory: mobile/rover_companion
        run: |
          flutter build apk --release

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          SRC_APK="mobile/rover_companion/build/app/outputs/flutter-apk/app-release.apk"
          DEST_APK="airover-companion-${TAG}.apk"

          if [ ! -f "$SRC_APK" ]; then
            echo "Error: $SRC_APK not found!"
            exit 1
          fi

          cp "$SRC_APK" "$DEST_APK"
          sha256sum "$DEST_APK" > "${DEST_APK}.sha256"

          echo "Generated APK: $DEST_APK ($(du -h "$DEST_APK" | cut -f1))"
          echo "SHA256: $(cat "${DEST_APK}.sha256")"

          cat << 'EOF' > release-notes.md
          ## 🚀 AI Rover Mobile Companion — Android APK Release

          An ad-free, high-performance Flutter companion app designed to interface directly with the **AI Autonomous Exploration Rover Mission Control** and ESP32 Dev gateway.

          ### ✨ Key Features
          - 📷 **Zero-Typing QR Pairing**: Instantly sync with Mission Control via camera QR scan or LAN IP.
          - 🕹 **Responsive Touch D-Pad**: Real-time forward, reverse, pivot left, and pivot right drive controls.
          - 📡 **Telemetry & HUD**: Live battery voltage, connection latency (ms), and rover state telemetry.
          - 🛑 **Hardware E-Stop**: Instant safety emergency brake triggering motor isolation.
          - 💡 **Low-Light Night Assist**: Remote flash control paired with edge perception luminance monitoring.

          ### 📦 Installation
          1. Download `airover-companion-*.apk` below to your Android device.
          2. Tap the APK to install (enable *Install Unknown Apps* if prompted).
          3. Launch **Rover Companion** and scan the QR code from Mission Control (`/companion` or `/deck`).

          ### 🔒 Integrity Check
          Verify the downloaded package checksum with:
          ```bash
          sha256sum -c airover-companion-*.apk.sha256
          ```
          EOF

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airover-companion-apk
          path: |
            airover-companion-*.apk
            airover-companion-*.apk.sha256
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.prepare_artifacts.outputs.tag }}"
          TITLE="${{ github.event.inputs.release_title || format('AI Rover Companion App {0}', steps.prepare_artifacts.outputs.tag) }}"

          echo "Publishing release: $TAG with title: $TITLE"

          # Check if release exists; if so, upload assets with clobber, else create new release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading new assets..."
            gh release upload "$TAG" airover-companion-*.apk airover-companion-*.apk.sha256 --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              airover-companion-*.apk \
              airover-companion-*.apk.sha256 \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false
          fi

          echo "✓ Release $TAG successfully published with Android APK assets!"
